services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: gradeflow
      POSTGRES_PASSWORD: gradeflow  # local development only; the port below is only open to this machine
      POSTGRES_DB: gradeflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeflow -d gradeflow"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # overrides .env's 127.0.0.1 default: on the compose network the db is reachable by service name
      DATABASE_URL: postgresql://gradeflow:gradeflow@db:5432/gradeflow
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # baked in at build time (Next.js reads this when it builds routes-manifest.json, not at runtime)
        GRADEFLOW_API: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
