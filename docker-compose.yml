services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: gradeflow
      POSTGRES_PASSWORD: gradeflow  # local development only; the port below is only open to this machine
      POSTGRES_DB: gradeflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
